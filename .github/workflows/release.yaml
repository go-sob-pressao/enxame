name: Release

on:
  push:
    tags: ['v*']

jobs:
  publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write          # atestado de proveniência (Cap. 31)
      attestations: write
    steps:
      - uses: actions/checkout@v7
      # A data da imagem é a do commit, e não a do build: o mesmo commit
      # dá a mesma imagem (Cap. 31).
      - name: Data do commit
        run: |
          data=$(git log -1 --format=%ct)
          echo "SOURCE_DATE_EPOCH=$data" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSAO=${{ github.ref_name }}
          provenance: mode=max
          sbom: true
          outputs: type=image,push=true,rewrite-timestamp=true
          tags: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
