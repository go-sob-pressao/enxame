name: CI

on:
  push: { branches: [main] }
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_PASSWORD: enxame
          POSTGRES_DB: enxame
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
        ports: ['5432:5432']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod      # a versão de Go tem uma única fonte: o go.mod
          cache: true

      - name: go.mod e go.sum em dia
        run: go mod tidy -diff

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0

      - name: Arquitetura
        run: make arch

      - name: Testes com race detector
        run: make race

      - name: Integração
        run: make integration
        env:
          ENXAME_DB_DSN: postgres://postgres:enxame@localhost:5432/enxame?sslmode=disable

      - name: Vulnerabilidades
        run: make vuln

      - name: Build
        run: make build

  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }    # buf breaking compara com a main
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod, cache: true }
      - name: Ferramentas nas versões fixadas
        run: make ferramentas-proto
      - name: Código gerado em dia
        run: |
          PATH="$(go env GOPATH)/bin:$PATH" make proto
          git diff --exit-code internal/transport/grpc/gen
      - name: Compatibilidade com a main
        run: |
          PATH="$(go env GOPATH)/bin:$PATH" \
            buf breaking --against '.git#branch=origin/main'

  simulacao:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod, cache: true }
      - name: Simulação determinística (seeds fixas)
        run: make sim
