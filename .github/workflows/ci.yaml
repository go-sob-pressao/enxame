name: CI

on:
  push: { branches: [main] }
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_PASSWORD: enxame
          POSTGRES_DB: enxame
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
        ports: ['5432:5432']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        # A versão de Go tem uma única fonte: o go.mod.
        with:
          go-version-file: go.mod
          cache: true

      - name: go.mod e go.sum em dia
        run: go mod tidy -diff

      - name: Nada para o go fix modernizar
        run: test -z "$(go fix -diff ./...)"

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0

      - name: Arquitetura
        run: make arch

      - name: Testes com race detector
        run: make race

      - name: Integração
        # O Teste de Realidade #2 mede latência com o gerador de carga no
        # mesmo processo: num runner compartilhado, a carga "normal" já
        # encosta no limite de 32 em curso, e o teste oscila. Ele vale na
        # máquina de referência (make integration, sem PULAR).
        run: make integration PULAR=TestRealidade2
        env:
          ENXAME_DB_DSN: "postgres://postgres:enxame@localhost:5432/\
            enxame?sslmode=disable"

      - name: Vulnerabilidades
        run: make vuln

      - name: Build
        run: make build

      - name: Build reproduzível
        run: make reproduzivel

  imagem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: A imagem constrói (sem publicar)
        uses: docker/build-push-action@v7
        with:
          file: deploy/docker/Dockerfile
          push: false

  operacao:
    runs-on: ubuntu-latest
    env:
      HELM: helm-v4.3.0-linux-amd64.tar.gz
      HELM_SHA256: >-
        86584a54def73570558f66f5111cc53dfed56689637ae32c1201205d494f54fb
    steps:
      - uses: actions/checkout@v7
      - name: Helm na versão fixada
        run: |
          curl -fsSLO "https://get.helm.sh/$HELM"
          echo "$HELM_SHA256  $HELM" | sha256sum -c
          tar xzf "$HELM" && sudo mv linux-amd64/helm /usr/local/bin/
      - name: Manifestos e chart
        run: make manifestos
      - name: Alarmes testados
        run: make alertas

  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }    # buf breaking compara com a main
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod, cache: true }
      - name: Ferramentas nas versões fixadas
        run: make ferramentas-proto
      - name: Código gerado em dia
        run: |
          PATH="$(go env GOPATH)/bin:$PATH" make proto
          git diff --exit-code internal/transport/grpc/gen
      - name: Compatibilidade com a main
        run: |
          PATH="$(go env GOPATH)/bin:$PATH" \
            buf breaking --against '.git#branch=origin/main'

  simulacao:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod, cache: true }
      - name: Simulação determinística (seeds fixas)
        run: make sim
