apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels: {{- include "enxame.rotulos" . | nindent 4 }}
spec:
  selector: {{- include "enxame.rotulos" . | nindent 4 }}
  ports:
    - {name: http, port: 8080, targetPort: http}
    - {name: grpc, port: 7233, targetPort: grpc}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-nos
  labels: {{- include "enxame.rotulos" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: {{- include "enxame.rotulos" . | nindent 4 }}
  ports:
    - {name: http, port: 8080, targetPort: http}
    - {name: grpc, port: 7233, targetPort: grpc}
