global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files: [/etc/prometheus/alertas.yml]

scrape_configs:
  # enxamed rodando no host: ./bin/enxamed ... -metricas :9090 (e, num
  # cluster local, os outros nós em :9092 e :9093 — a 9091 é a do
  # próprio Prometheus).
  - job_name: enxamed
    static_configs:
      - targets:
          - host.docker.internal:9090
          - host.docker.internal:9092
          - host.docker.internal:9093
