# O Enxame em Kubernetes (Cap. 32): três enxamed num StatefulSet. A
# base não sabe onde está o banco: o Secret "enxame", com dsn, tokens e
# worker-token, vem de cada overlay.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      app.kubernetes.io/name: enxamed
      app.kubernetes.io/part-of: enxame
    includeSelectors: true
resources:
  - statefulset.yaml
  - servicos.yaml
  - pdb.yaml
