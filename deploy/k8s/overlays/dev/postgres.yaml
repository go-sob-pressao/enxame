# Um PostgreSQL de laboratório, sem volume persistente. Em produção o
# banco fica fora do cluster (overlay prod).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      containers:
        - name: postgres
          image: postgres:18.6
          args: [-c, max_connections=300]
          env:
            - {name: POSTGRES_PASSWORD, value: enxame}
            - {name: POSTGRES_DB, value: enxame}
          ports:
            - {name: pg, containerPort: 5432}
          readinessProbe:
            exec: {command: [pg_isready, -U, postgres, -d, enxame]}
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  type: NodePort
  selector: {app: postgres}
  ports:
    - {name: pg, port: 5432, targetPort: pg, nodePort: 30432}
