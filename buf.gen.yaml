# Plugins locais, instalados com go install nas versões do Makefile
# (make ferramentas): a geração não depende do registro remoto do buf.
version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/go-sob-pressao/enxame/internal/transport/grpc/gen
plugins:
  - local: protoc-gen-go
    out: internal/transport/grpc/gen
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: internal/transport/grpc/gen
    opt: paths=source_relative
inputs:
  - directory: internal/transport/grpc/proto
